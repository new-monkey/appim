name: Bug report
description: Something didn't install, launch, or uninstall correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact anything private from the output before pasting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what actually happened.
      placeholder: |
        $ appim install ~/Downloads/Foo-1.2-x86_64.AppImage
        ...
    validations:
      required: true
  - type: input
    id: appim-version
    attributes:
      label: appim version
      description: Output of `appim --version`.
    validations:
      required: true
  - type: input
    id: appimage
    attributes:
      label: AppImage
      description: Name and version of the AppImage involved, plus a download link if it is public.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Distribution and desktop environment
      placeholder: Fedora 41, GNOME 47 / KDE Plasma 6.2
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
    validations:
      required: true
  - type: textarea
    id: installed
    attributes:
      label: Installed apps
      description: Output of `appim list`, if relevant.
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Desktop entry contents, screenshots, logs.
    validations:
      required: false
